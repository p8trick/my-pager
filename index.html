<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Order Terminal V3.8</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --card: #111111;
    --key: #222222;
    --accent: #FF9F0A; 
    --history: #94FF00; 
    --text: #ffffff;
    --danger: #FF453A; 
    --next: #333333;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
  }

  .header { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 12px; color: #444; letter-spacing: 2px; }
  #settingsBtn { background: none; border: 1px solid #333; color: #888; padding: 4px 10px; border-radius: 6px; font-size: 14px; }

  .display-area { padding: 5px 16px; }
  .display {
    background: var(--card);
    border-radius: 20px;
    height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 25px;
    position: relative;
    border: 1px solid rgba(255, 159, 10, 0.1);
    box-shadow: 0 0 15px rgba(255, 159, 10, 0.05);
    animation: breathe 4s ease-in-out infinite;
    transition: all 0.1s ease;
  }

  /* 左侧统计监控区样式 */
  .stats-box {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-left: 1px solid #333;
    padding-left: 12px;
    pointer-events: none;
  }
  .last-label { font-size: 9px; color: #555; font-weight: 900; letter-spacing: 1px; }
  .last-num-display { font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #888; margin-bottom: 2px; }
  .time-ago-display { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 22px; 
    color: var(--history); 
    font-weight: 700;
    line-height: 1;
    transition: color 0.5s ease;
  }

  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 5px rgba(255, 159, 10, 0.02); border-color: rgba(255, 159, 10, 0.1); }
    50% { box-shadow: 0 0 20px rgba(255, 159, 10, 0.2); border-color: rgba(255, 159, 10, 0.4); }
  }

  .display.playing {
    animation: none;
    border-color: var(--history);
    box-shadow: 0 0 30px rgba(148, 255, 0, 0.4), inset 0 0 20px rgba(148, 255, 0, 0.1);
  }

  .display-label { font-size: 10px; color: #666; font-weight: 600; margin-bottom: -15px; }
  .display-number { 
    font-family: 'JetBrains Mono', monospace; 
    font-size: 110px; 
    color: var(--accent);
    text-align: right;
    line-height: 1;
  }

  .history-container { padding: 8px 16px; display: flex; align-items: center; gap: 10px; }
  .history-label { font-size: 10px; color: #444; width: 50px; font-weight: 900; line-height: 1; }
  .history-bar { flex: 1; display: flex; gap: 8px; overflow-x: auto; }
  .history-bar::-webkit-scrollbar { display: none; }
  
  .history-chip {
    background: #1a1a1a; padding: 6px 12px; border-radius: 10px;
    color: var(--history); font-family: 'JetBrains Mono', monospace;
    font-size: 16px; flex-shrink: 0; border: 1px solid #222;
  }
  .history-chip:active, .history-chip.playing {
    background: #ffffff !important; color: #000000 !important; transform: scale(0.9);
  }

  .keypad-area { flex: 1; display: flex; flex-direction: column; padding: 10px 16px 16px; gap: 10px; padding-bottom: env(safe-area-inset-bottom); }
  .key-row { display: flex; gap: 10px; flex: 1; }
  .key {
    flex: 1; background: var(--key); border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 32px; color: #fff; border: none;
    transition: all 0.1s ease;
  }

  .key:active, .key.active-feedback {
    background: #ffffff !important; color: #000000 !important; transform: scale(0.95) !important;         
  }

  .key.go { flex: 2; background: var(--accent); color: #000; font-size: 20px; font-weight: 900; border-radius: 20px; }
  .key.go.playing { background: #ffffff !important; color: #000000 !important; transform: scale(0.98); }
  
  .key.next { flex: 1; background: var(--next); color: #FFD60A; font-size: 20px; font-weight: 900; border-radius: 20px; }
  .key.clear { color: var(--danger); font-size: 20px; font-weight: 900; }
  .key.prev { color: #FFD60A; font-size: 20px; font-weight: 900; }

  .settings-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; z-index: 100; padding: 40px 20px; }
  .settings-overlay.show { display: block; }
  .settings-card { background: #111; border-radius: 25px; padding: 30px; border: 1px solid #222; max-width: 500px; margin: 0 auto; }
  .setting-item { margin-bottom: 20px; }
  .setting-item label { display: block; font-size: 11px; color: #555; margin-bottom: 8px; font-weight: 900; }
  select, input[type="range"] { width: 100%; padding: 12px; background: #000; color: #fff; border: 1px solid #333; border-radius: 10px; font-size: 16px; }
  .test-btn { margin-top: 10px; width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 10px; font-size: 13px; font-weight: 600; }
</style>
</head>
<body ontouchstart="">

<div id="noSleepVideoContainer" style="position:absolute; width:1px; height:1px; opacity:0.01; pointer-events:none;"></div>

<div class="header">
  <h1>ORDER TERMINAL V3.8</h1>
  <button id="settingsBtn">SETTINGS</button>
</div>

<div class="display-area">
  <div class="display" id="mainDisplay">
    <div class="stats-box" id="statsBox">
        <div class="last-label">LAST</div>
        <div class="last-num-display" id="lastNumLabel">#--</div>
        <div class="time-ago-display" id="timeDisplay">0m</div>
    </div>
    <div class="display-label">READY TO SERVE</div>
    <div class="display-number" id="displayNum">—</div>
  </div>
</div>

<div class="history-container">
  <div class="history-label">RECENT<br>LOG</div>
  <div class="history-bar" id="historyBar"></div>
</div>

<div class="keypad-area">
  <div class="key-row">
    <div class="key" onclick="press('1')">1</div>
    <div class="key" onclick="press('2')">2</div>
    <div class="key" onclick="press('3')">3</div>
  </div>
  <div class="key-row">
    <div class="key" onclick="press('4')">4</div>
    <div class="key" onclick="press('5')">5</div>
    <div class="key" onclick="press('6')">6</div>
  </div>
  <div class="key-row">
    <div class="key" onclick="press('7')">7</div>
    <div class="key" onclick="press('8')">8</div>
    <div class="key" onclick="press('9')">9</div>
  </div>
  <div class="key-row">
    <div class="key clear" onclick="clearAll()">CLR</div>
    <div class="key" onclick="press('0')">0</div>
    <div class="key prev" onclick="skipToPrev()">PREV</div>
  </div>
  <div class="key-row">
    <div class="key go" id="goBtn" onclick="announce()">ANNOUNCE</div>
    <div class="key next" onclick="skipToNext()">NEXT</div>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-card">
    <div class="setting-item">
      <label>Voice Engine</label>
      <select id="voiceSelect"></select>
      <button class="test-btn" onclick="testVoice()">🔊 TEST VOICE & DING</button>
    </div>
    <div class="setting-item">
      <label>Repeat: <span id="repeatVal">2</span> Times</label>
      <input type="range" id="repeatRange" min="1" max="5" value="2">
    </div>
    <div class="setting-item">
      <label>Speed: <span id="speedVal">1.0</span>x</label>
      <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="1.0">
    </div>
    <button onclick="saveAndClose()" style="width:100%; padding:18px; background:var(--accent); border:none; font-weight:900; border-radius:15px; color:#000; font-size:18px;">DONE</button>
  </div>
</div>

<script>
  let currentVal = '';
  let history = [];
  let audioCtx = null;
  let wakeLock = null;
  let isAborted = false;
  let lastCallTimestamp = null;
  let lastCallNumber = '--';

  const blankVideoSrc = "data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDJpc29tYXZjMQAAAzphdmNjMQAAAAh0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAMWhhbmRsAAAAAHZpZGVvAAAAAAAAAAAAAAAAbWluZgAAABR2bWhkAAAAAAABAAAAAAAAAAAAAAAkZGluZgAAABxkcmVmAAAAAAAAAAEAAAAMdXJsIAAAAAEAAAEcbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAABDcAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAACdHJha3MAAABydGtoZAAAAAMAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAD";

  async function requestWakeLock() {
    if ('wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } 
      catch (err) { console.log(err); }
    }
  }

  function startAntiSleep() {
    requestWakeLock();
    const container = document.getElementById('noSleepVideoContainer');
    if (!container.querySelector('video')) {
      const v = document.createElement('video');
      v.src = blankVideoSrc; v.muted = true; v.loop = true; v.playsInline = true;
      v.play().catch(()=>{}); container.appendChild(v);
    }
  }

  function playOriginalDing() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const dur = 0.55;
    const osc1 = audioCtx.createOscillator(); const g1 = audioCtx.createGain();
    osc1.type = 'sine'; osc1.frequency.value = 830;
    g1.gain.setValueAtTime(0.35, now); g1.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc1.connect(g1).connect(audioCtx.destination);
    const osc2 = audioCtx.createOscillator(); const g2 = audioCtx.createGain();
    osc2.type = 'sine'; osc2.frequency.value = 1245;
    g2.gain.setValueAtTime(0.2, now); g2.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.7);
    osc2.connect(g2).connect(audioCtx.destination);
    osc1.start(now); osc2.start(now); osc1.stop(now + dur); osc2.stop(now + dur);
  }

  // 强化后的每分钟更新逻辑
  function updateTimeDisplay() {
    if (!lastCallTimestamp) return;
    const now = Date.now();
    const diffMinutes = Math.floor((now - lastCallTimestamp) / 60000);
    const displayElement = document.getElementById('timeDisplay');
    
    if (diffMinutes >= 30) {
      displayElement.textContent = "30+m";
      displayElement.style.color = "#444";
    } else if (diffMinutes >= 10) {
      displayElement.textContent = diffMinutes + "m";
      displayElement.style.color = "var(--danger)"; 
    } else if (diffMinutes >= 5) {
      displayElement.textContent = diffMinutes + "m";
      displayElement.style.color = "#FFD60A"; 
    } else {
      displayElement.textContent = diffMinutes + "m";
      displayElement.style.color = "var(--history)"; 
    }
  }
  setInterval(updateTimeDisplay, 60000);

  function loadSettings() {
    const savedRepeat = localStorage.getItem('repeat') || 2;
    const savedSpeed = localStorage.getItem('speed') || 1.0;
    document.getElementById('repeatRange').value = savedRepeat;
    document.getElementById('repeatVal').textContent = savedRepeat;
    document.getElementById('speedRange').value = savedSpeed;
    document.getElementById('speedVal').textContent = savedSpeed;
  }

  function saveAndClose() {
    localStorage.setItem('repeat', document.getElementById('repeatRange').value);
    localStorage.setItem('speed', document.getElementById('speedRange').value);
    localStorage.setItem('voiceName', document.getElementById('voiceSelect').value);
    toggleSettings();
  }

  function initVoices() {
    const voices = window.speechSynthesis.getVoices();
    const select = document.getElementById('voiceSelect');
    if(!voices.length) return;
    const savedVoice = localStorage.getItem('voiceName');
    select.innerHTML = '';
    voices.forEach((v) => {
      const opt = document.createElement('option');
      opt.value = v.name; opt.textContent = `${v.name} (${v.lang})`;
      if (v.name === savedVoice || v.name.includes('Samantha')) opt.selected = true;
      select.appendChild(opt);
    });
  }

  window.speechSynthesis.onvoiceschanged = initVoices;
  loadSettings(); initVoices();

  function press(num) { startAntiSleep(); if (currentVal.length < 3) { currentVal += num; updateDisplay(); } }
  
  function clearAll() {
    startAntiSleep();
    if (window.speechSynthesis.speaking) {
      isAborted = true; 
      window.speechSynthesis.cancel();
      document.getElementById('mainDisplay').classList.remove('playing');
      document.getElementById('goBtn').classList.remove('playing');
      const chips = document.querySelectorAll('.history-chip');
      chips.forEach(c => c.classList.remove('playing'));
      return; 
    }
    currentVal = ''; 
    updateDisplay();
  }

  function updateDisplay() { document.getElementById('displayNum').textContent = currentVal || '—'; }

  function skipToNext() {
    let val = parseInt(currentVal, 10) || 0;
    currentVal = String(val + 1 > 999 ? 1 : val + 1);
    updateDisplay();
  }

  function skipToPrev() {
    let val = parseInt(currentVal, 10) || 0;
    currentVal = String(val - 1 < 1 ? 999 : val - 1);
    updateDisplay();
  }

  function testVoice() {
    startAntiSleep(); playOriginalDing();
    setTimeout(() => {
      const voiceName = document.getElementById('voiceSelect').value;
      const speed = document.getElementById('speedRange').value;
      const utter = new SpeechSynthesisUtterance("Order number 42");
      utter.voice = window.speechSynthesis.getVoices().find(v => v.name === voiceName);
      utter.rate = speed;
      window.speechSynthesis.speak(utter);
    }, 600);
  }

  function announce(fromHistoryValue = null, chipElement = null) {
    startAntiSleep();
    if (!currentVal && !fromHistoryValue) return;
    if (window.speechSynthesis.speaking) return;
    
    isAborted = false; 
    const originalVal = currentVal;
    const numToSay = fromHistoryValue || currentVal;
    const targetBtn = chipElement || document.getElementById('goBtn');
    const repeatTimes = parseInt(document.getElementById('repeatRange').value);
    const speed = document.getElementById('speedRange').value;
    const voiceName = document.getElementById('voiceSelect').value;
    const mainDisplay = document.getElementById('mainDisplay');
    let count = 0;
    
    if (fromHistoryValue) { currentVal = fromHistoryValue; updateDisplay(); }
    
    targetBtn.classList.add('playing'); 
    mainDisplay.classList.add('playing');

    // 记录呼叫时间与号码
    lastCallTimestamp = Date.now();
    lastCallNumber = numToSay;
    document.getElementById('lastNumLabel').textContent = "#" + lastCallNumber;
    updateTimeDisplay();

    async function performCycle() {
      if (isAborted) return; 

      playOriginalDing(); 
      await new Promise(r => setTimeout(r, 650)); 
      
      if (isAborted) return;

      const utter = new SpeechSynthesisUtterance(`Order number ${numToSay}`);
      utter.voice = window.speechSynthesis.getVoices().find(v => v.name === voiceName);
      utter.rate = speed;
      utter.onend = () => {
        if (isAborted) return;
        count++;
        if (count < repeatTimes) { setTimeout(performCycle, 400); } 
        else {
          targetBtn.classList.remove('playing'); 
          mainDisplay.classList.remove('playing');
          if (fromHistoryValue) { 
            currentVal = originalVal; 
          } else {
            let next = parseInt(numToSay, 10) + 1;
            currentVal = String(next > 999 ? 1 : next);
            if (!history.includes(numToSay)) { 
              history.unshift(numToSay); 
              if (history.length > 10) history.pop(); 
              renderHistory(); 
            }
          }
          updateDisplay();
        }
      };
      window.speechSynthesis.speak(utter);
    }
    performCycle();
  }

  function renderHistory() {
    const bar = document.getElementById('historyBar'); bar.innerHTML = '';
    history.forEach(n => {
      const chip = document.createElement('div');
      chip.className = 'history-chip'; chip.textContent = `#${n}`;
      chip.onclick = () => announce(n, chip); bar.appendChild(chip);
    });
  }

  function toggleSettings() { document.getElementById('settingsOverlay').classList.toggle('show'); }
  document.getElementById('settingsBtn').onclick = toggleSettings;
  document.getElementById('speedRange').oninput = (e) => { document.getElementById('speedVal').textContent = e.target.value; };
  document.getElementById('repeatRange').oninput = (e) => { document.getElementById('repeatVal').textContent = e.target.value; };

  document.addEventListener('click', startAntiSleep, { once: true });
  document.addEventListener('visibilitychange', () => {
    if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
  });
</script>
</body>
</html>
